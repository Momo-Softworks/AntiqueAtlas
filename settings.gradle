pluginManagement {
    repositories {
        maven {
            // RetroFuturaGradle and other GTNH plugins
            name = 'GTNH Maven'
            url = uri('https://nexus.gtnewhorizons.com/repository/public/')
            mavenContent {
                includeGroupByRegex 'com\\.gtnewhorizons\\..+'
                includeGroup 'com.gtnewhorizons'
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
    }
}

rootProject.name = 'antiqueatlas'
