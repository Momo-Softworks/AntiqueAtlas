plugins {
    id 'java'
    // Modern 1.7.10 toolchain, replaces the legacy ForgeGradle 1.2 'forge' plugin.
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'hunternif.mc.atlas'
ext.mod_version = "${version_major}.${version_minor}.${version_patch}"
version = "${mc_version}-${mod_version}" // ends up in the jar file name

base {
    archivesName = 'antiqueatlas'
}

println "Building antiqueatlas ${version}"

java {
    toolchain {
        // Compile/run the mod with Java 8. No vendor is pinned on purpose so the
        // Guix-provided icedtea (OpenJDK 8) toolchain is accepted (see rfg-build.sh);
        // pinning a vendor would make Gradle try to download a JDK, which can't run
        // on Guix System.
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

minecraft {
    mcVersion = mc_version
    // Forge and FML are included by default for 1.7.10 (usesForge/usesFml default true).

    // Generate hunternif/mc/atlas/Tags.java with VERSION = mod_version. Referenced from
    // AntiqueAtlasMod (replaces the old ForgeGradle `replace '@VERSION@', ...`). This is
    // RFG's recommended approach over the hacky javac-plugin token replacement.
    injectedTags.put('VERSION', mod_version)
}

tasks.injectTags.configure {
    outputClassName = 'hunternif.mc.atlas.Tags'
}

processResources {
    inputs.property 'mod_version', mod_version
    inputs.property 'mc_version', mc_version
    // Fill ${version} and ${mcversion} in mcmod.info.
    filesMatching('mcmod.info') {
        expand 'version': mod_version, 'mcversion': mc_version
    }
}

repositories {
    maven {
        // Provides RFG's rfg-javac-plugin (the @VERSION@ tag processor) and other GTNH artifacts.
        name = 'GTNH Maven'
        url = uri('https://nexus.gtnewhorizons.com/repository/public/')
    }
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Minecraft/Forge are provided automatically by RetroFuturaGradle.
}
