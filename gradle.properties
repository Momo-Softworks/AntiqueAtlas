mc_version=1.7.10
forge_version=10.13.4.1558-1.7.10
version_major=4
version_minor=4
version_patch=0

# --- Build environment (RetroFuturaGradle) ---
# Never let Gradle auto-provision a JDK: a downloaded generic-Linux JDK won't run on
# Guix System (no FHS ld-linux). The Java 8 toolchain is supplied from Guix by
# rfg-build.sh via -Dorg.gradle.java.installations.paths.
org.gradle.java.installations.auto-download=false
# Locate the Guix-provided JDK toolchains by env var (rfg-build.sh exports JDK8/JDK21).
# Env vars survive Gradle's forked build JVM, unlike -D system properties.
org.gradle.java.installations.fromEnv=JDK8,JDK17,JDK21
# RFG decompiles+recompiles Minecraft; give it room.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
